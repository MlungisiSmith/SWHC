version: '3.8'

services:
  web:
    build: .
    container_name: swhc-v2-web
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/swch.db
      - REDIS_URL=redis://swhc-v2-redis:6379/0
      - APP_ENV=production
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-change-me-encryption-key}
      - SWITCH_USERNAME=${SWITCH_USERNAME:-networks}
      - SWITCH_PASSWORD=${SWITCH_PASSWORD:-w00Lw0rTh$}
      - SWITCH_ENABLE_SECRET=${SWITCH_ENABLE_SECRET:-w00Lw0rTh$}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - swhc-network

  redis:
    image: redis:7-alpine
    container_name: swhc-v2-redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - swhc-network

networks:
  swhc-network:
    driver: bridge
