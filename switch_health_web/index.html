<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greystone - Network Intelligence Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-red: #c85a52;
            --dark-red: #a84738;
            --light-red: #d9776d;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #e0e0e0;
            min-height: 100vh;
        }

        /* LOGIN SCREEN */
        .login-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
        }

        .login-wrapper.hidden {
            display: none;
        }

        .login-card {
            background: rgba(30, 30, 30, 0.95);
            backdrop-filter: blur(20px);
            border: 2px solid var(--primary-red);
            border-radius: 12px;
            padding: 50px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
        }

        .login-logo-img {
            height: 60px;
            width: auto;
            margin-bottom: 20px;
        }

        .login-logo {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--primary-red);
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        .login-subtitle {
            color: #959d9f;
            font-size: 0.9rem;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--primary-red);
            font-size: 0.9rem;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(200, 90, 82, 0.2);
            border-radius: 8px;
            color: #e0e0e0;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary-red);
            background: rgba(200, 90, 82, 0.1);
            box-shadow: 0 0 0 3px rgba(200, 90, 82, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, var(--primary-red), var(--dark-red));
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(200, 90, 82, 0.3);
        }

        #connect-error {
            color: #ff6b6b;
            font-size: 0.9rem;
            margin-top: 15px;
            padding: 10px;
            background: rgba(255, 107, 107, 0.1);
            border-radius: 6px;
            border: 1px solid rgba(255, 107, 107, 0.3);
            display: none;
        }

        /* DASHBOARD */
        .dashboard {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .dashboard.hidden {
            display: none;
        }

        /* Header */
        .header {
            background: linear-gradient(180deg, rgba(30, 30, 30, 0.95) 0%, rgba(20, 20, 20, 0.9) 100%);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--primary-red);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--primary-red);
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.5px;
        }

        .header-right {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .device-info {
            text-align: right;
        }

        .device-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: #fff;
        }

        .device-status {
            font-size: 0.85rem;
            color: var(--primary-red);
            margin-top: 2px;
            font-weight: 600;
        }

        .status-live {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            background: rgba(200, 90, 82, 0.1);
            border: 2px solid var(--primary-red);
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--primary-red);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background: var(--primary-red);
            border-radius: 50%;
            animation: pulse-animation 2s infinite;
        }

        @keyframes pulse-animation {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .btn-disconnect {
            padding: 10px 20px;
            background: rgba(200, 90, 82, 0.15);
            border: 2px solid var(--primary-red);
            color: var(--primary-red);
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .btn-disconnect:hover {
            background: rgba(200, 90, 82, 0.3);
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 0;
            background: rgba(20, 20, 20, 0.8);
            border-bottom: 2px solid rgba(200, 90, 82, 0.2);
            padding: 0 40px;
            overflow-x: auto;
        }

        .tab-button {
            padding: 16px 24px;
            background: transparent;
            border: none;
            color: #959d9f;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.95rem;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .tab-button:hover {
            color: var(--primary-red);
        }

        .tab-button.active {
            color: var(--primary-red);
            border-bottom-color: var(--primary-red);
        }

        /* Content */
        .content {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .tab-content {
            display: none;
            flex: 1;
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
        }

        /* Topology Visualization */
        .topo-wrapper {
            display: flex;
            gap: 20px;
            flex: 1;
        }

        .topo-canvas-container {
            flex: 1;
            background: rgba(30, 30, 30, 0.6);
            border: 2px solid rgba(200, 90, 82, 0.2);
            border-radius: 12px;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        #topoSVG {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(20,20,20,0.8) 0%, rgba(30,30,30,0.6) 100%);
            border-radius: 8px;
        }

        .topo-panel {
            width: 350px;
            background: rgba(30, 30, 30, 0.6);
            border: 2px solid rgba(200, 90, 82, 0.2);
            border-radius: 12px;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .panel-section {
            border: 2px solid rgba(200, 90, 82, 0.1);
            border-radius: 8px;
            padding: 12px;
            background: rgba(200, 90, 82, 0.03);
        }

        .panel-title {
            font-weight: 700;
            color: var(--primary-red);
            margin-bottom: 12px;
            font-size: 0.95rem;
        }

        .device-entry {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            background: rgba(200, 90, 82, 0.05);
            border-radius: 6px;
            margin-bottom: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .device-entry:hover {
            background: rgba(200, 90, 82, 0.15);
        }

        .device-status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .device-status-indicator.up {
            background: #00ff00;
            box-shadow: 0 0 8px #00ff00;
        }

        .device-status-indicator.down {
            background: #ff0000;
            box-shadow: 0 0 8px #ff0000;
        }

        .logs-panel {
            background: rgba(30, 30, 30, 0.6);
            border: 2px solid rgba(200, 90, 82, 0.2);
            border-radius: 12px;
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            margin-top: 20px;
        }

        .logs-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 2px solid rgba(200, 90, 82, 0.1);
        }

        .logs-title {
            font-weight: 700;
            color: var(--primary-red);
            font-size: 1rem;
        }

        .logs-filter {
            display: flex;
            gap: 8px;
        }

        .filter-btn {
            padding: 4px 10px;
            background: rgba(200, 90, 82, 0.1);
            border: 2px solid rgba(200, 90, 82, 0.2);
            color: var(--primary-red);
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
            transition: all 0.3s;
        }

        .filter-btn.active {
            background: rgba(200, 90, 82, 0.3);
            border-color: var(--primary-red);
        }

        .logs-content {
            flex: 1;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
        }

        .log-entry {
            padding: 8px;
            background: rgba(200, 90, 82, 0.05);
            border-left: 3px solid var(--primary-red);
            margin-bottom: 6px;
            border-radius: 2px;
            display: flex;
            gap: 10px;
        }

        .log-entry.error {
            border-left-color: #ff6b6b;
            background: rgba(255, 107, 107, 0.05);
            color: #ff9999;
        }

        .log-entry.warning {
            border-left-color: #ffaa00;
            background: rgba(255, 170, 0, 0.05);
            color: #ffcc99;
        }

        .log-entry.info {
            border-left-color: var(--primary-red);
            background: rgba(200, 90, 82, 0.05);
            color: #ffa080;
        }

        .log-time {
            color: #707070;
            flex-shrink: 0;
            min-width: 100px;
            font-size: 0.75rem;
        }

        .log-msg {
            flex: 1;
            word-break: break-word;
        }

        /* Node styles */
        .topo-node {
            cursor: pointer;
            transition: all 0.3s;
        }

        .topo-node:hover circle {
            filter: brightness(1.3);
        }

        .topo-node text {
            pointer-events: none;
        }

        .topo-link {
            stroke-width: 2;
            fill: none;
            stroke-dasharray: 5,5;
            animation: dashMove 20s linear infinite;
        }

        @keyframes dashMove {
            to {
                stroke-dashoffset: -100;
            }
        }

        .topo-link.up {
            stroke: #00ff00;
            opacity: 0.6;
        }

        .topo-link.down {
            stroke: #ff0000;
            opacity: 0.3;
        }

        .topo-label {
            font-size: 11px;
            fill: #959d9f;
            pointer-events: none;
        }

        /* Metric cards */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .metric-box {
            background: rgba(30, 30, 30, 0.6);
            border: 2px solid rgba(200, 90, 82, 0.2);
            border-radius: 12px;
            padding: 24px;
            position: relative;
            overflow: hidden;
        }

        .metric-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary-red), var(--dark-red));
        }

        .metric-value {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--primary-red);
            margin-bottom: 12px;
        }

        .metric-bar {
            height: 6px;
            background: rgba(200, 90, 82, 0.1);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .metric-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary-red), var(--dark-red));
            width: 0%;
            transition: width 0.5s ease;
        }

        /* Charts */
        .chart-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .chart-box {
            background: rgba(30, 30, 30, 0.6);
            border: 2px solid rgba(200, 90, 82, 0.2);
            border-radius: 12px;
            padding: 24px;
        }

        .chart-title {
            font-weight: 700;
            color: var(--primary-red);
            margin-bottom: 20px;
            font-size: 1.05rem;
        }

        .chart-container {
            position: relative;
            height: 300px;
        }

        /* Configuration Workflow */
        .workflow-container {
            background: rgba(30, 30, 30, 0.6);
            border: 2px solid rgba(200, 90, 82, 0.2);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .workflow-title {
            font-weight: 700;
            color: var(--primary-red);
            margin-bottom: 20px;
            font-size: 1.1rem;
        }

        .workflow-diagram {
            display: flex;
            align-items: center;
            justify-content: space-around;
            gap: 15px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding: 10px;
        }

        .workflow-step {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            min-width: 100px;
        }

        .workflow-icon {
            width: 50px;
            height: 50px;
            background: rgba(200, 90, 82, 0.1);
            border: 2px solid var(--primary-red);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .workflow-label {
            font-size: 0.85rem;
            color: #a0a0a0;
            text-align: center;
            font-weight: 600;
        }

        .workflow-arrow {
            font-size: 24px;
            color: var(--primary-red);
        }

        .config-controls {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .config-selector {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .config-selector label {
            font-weight: 700;
            color: var(--primary-red);
            font-size: 0.9rem;
        }

        .config-selector select {
            padding: 10px;
            background: rgba(30,30,30,0.8);
            border: 2px solid rgba(200,90,82,0.2);
            color: #fff;
            border-radius: 6px;
        }

        .config-params {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .param-input {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .param-input label {
            font-size: 0.85rem;
            color: var(--primary-red);
            font-weight: 600;
        }

        .param-input input {
            padding: 8px 12px;
            background: rgba(30,30,30,0.8);
            border: 2px solid rgba(200,90,82,0.2);
            color: #fff;
            border-radius: 6px;
        }

        .config-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn-config {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s;
        }

        .btn-preview {
            background: rgba(200,90,82,0.2);
            border: 2px solid var(--primary-red);
            color: var(--primary-red);
        }

        .btn-preview:hover {
            background: rgba(200,90,82,0.3);
        }

        .btn-apply {
            background: linear-gradient(135deg, var(--primary-red), var(--dark-red));
            color: #fff;
        }

        .btn-apply:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(200, 90, 82, 0.3);
        }

        .config-output {
            display: none;
            background: rgba(0,0,0,0.3);
            border: 2px solid rgba(200,90,82,0.2);
            border-radius: 6px;
            padding: 15px;
            font-family: monospace;
            font-size: 0.8rem;
            color: #90EE90;
            max-height: 300px;
            overflow-y: auto;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(200, 90, 82, 0.2);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(200, 90, 82, 0.4);
        }
    </style>
</head>
<body>
    <!-- LOGIN -->
    <div class="login-wrapper" id="loginWrapper">
        <div class="login-card">
            <img src="/greystone-logo.png" alt="Greystone" class="login-logo-img" onerror="this.style.display='none'">
            <div class="login-logo">GREYSTONE</div>
            <div class="login-subtitle">Network Intelligence Dashboard</div>
            
            <form id="connectForm">
                <div class="form-group">
                    <label>Switch IP Address</label>
                    <input type="text" id="switchIP" placeholder="192.168.1.1" required>
                </div>
                
                <div class="form-group">
                    <label>Device Type</label>
                    <select id="vendorType" required>
                        <option value="auto">Auto-detect</option>
                        <option value="cisco">Cisco IOS/XE</option>
                        <option value="huawei">Huawei VRP</option>
                    </select>
                </div>
                
                <button type="submit" class="login-btn">Connect Now</button>
                <div id="connect-error"></div>
            </form>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div class="dashboard hidden" id="dashboard">
        <!-- Header -->
        <div class="header">
            <div class="logo"><i class="fas fa-network-wired"></i> GREYSTONE</div>
            <div class="header-right">
                <div class="device-info">
                    <div class="device-name" id="deviceName">Connecting...</div>
                    <div class="device-status" id="deviceVendor">Detecting...</div>
                </div>
                <div class="status-live">
                    <div class="pulse-dot"></div>
                    <span id="healthStatus">Initializing</span>
                </div>
                <button class="btn-disconnect" id="disconnectBtn">Disconnect</button>
            </div>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab-button active" data-tab="overview">
                <i class="fas fa-gauge-high"></i> Overview
            </button>
            <button class="tab-button" data-tab="topology">
                <i class="fas fa-sitemap"></i> Visual Topology
            </button>
            <button class="tab-button" data-tab="analytics">
                <i class="fas fa-chart-line"></i> Analytics
            </button>
            <button class="tab-button" data-tab="config">
                <i class="fas fa-sliders-h"></i> Configuration
            </button>
        </div>

        <!-- Content -->
        <div class="content">
            <!-- Overview Tab -->
            <div class="tab-content active" id="overview">
                <div class="metrics-grid" id="metricsGrid"></div>
                <div class="chart-section">
                    <div class="chart-box">
                        <div class="chart-title">CPU Utilization</div>
                        <div class="chart-container">
                            <canvas id="cpuChart"></canvas>
                        </div>
                    </div>
                    <div class="chart-box">
                        <div class="chart-title">Memory Usage</div>
                        <div class="chart-container">
                            <canvas id="memoryChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Topology Tab -->
            <div class="tab-content" id="topology">
                <div class="topo-wrapper">
                    <div class="topo-canvas-container">
                        <svg id="topoSVG"></svg>
                    </div>
                    <div class="topo-panel">
                        <div class="panel-section">
                            <div class="panel-title"><i class="fas fa-server"></i> Devices</div>
                            <div id="deviceList"></div>
                        </div>
                        <div class="panel-section">
                            <div class="panel-title"><i class="fas fa-link"></i> Links</div>
                            <div id="linkList"></div>
                        </div>
                    </div>
                </div>
                <div class="logs-panel">
                    <div class="logs-header">
                        <div class="logs-title"><i class="fas fa-file-alt"></i> Network Events</div>
                        <div class="logs-filter">
                            <button class="filter-btn active" data-filter="all">All</button>
                            <button class="filter-btn" data-filter="error">Errors</button>
                            <button class="filter-btn" data-filter="warning">Warnings</button>
                            <button class="filter-btn" data-filter="info">Info</button>
                        </div>
                    </div>
                    <div class="logs-content" id="logsContent"></div>
                </div>
            </div>

            <!-- Analytics Tab -->
            <div class="tab-content" id="analytics">
                <div class="chart-section">
                    <div class="chart-box">
                        <div class="chart-title">Health History</div>
                        <div class="chart-container">
                            <canvas id="healthChart"></canvas>
                        </div>
                    </div>
                    <div class="chart-box">
                        <div class="chart-title">Performance Metrics</div>
                        <div class="chart-container">
                            <canvas id="performanceChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Configuration Tab -->
            <div class="tab-content" id="config">
                <div class="workflow-container">
                    <div class="workflow-title"><i class="fas fa-project-diagram"></i> Configuration Workflow</div>
                    <div class="workflow-diagram">
                        <div class="workflow-step">
                            <div class="workflow-icon">1️⃣</div>
                            <div class="workflow-label">Select Template</div>
                        </div>
                        <div class="workflow-arrow">→</div>
                        <div class="workflow-step">
                            <div class="workflow-icon">2️⃣</div>
                            <div class="workflow-label">Enter Parameters</div>
                        </div>
                        <div class="workflow-arrow">→</div>
                        <div class="workflow-step">
                            <div class="workflow-icon">3️⃣</div>
                            <div class="workflow-label">Preview Config</div>
                        </div>
                        <div class="workflow-arrow">→</div>
